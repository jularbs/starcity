# Install as /etc/nginx/sites-available/starcity-uat after installing the
# Cloudflare Origin Certificate and private key at the paths below.

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /opt/starcity/shared/tls/fullchain.pem;
    ssl_certificate_key /opt/starcity/shared/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    server_name uat-api.starcity.com.ph;
    ssl_certificate /opt/starcity/shared/tls/fullchain.pem;
    ssl_certificate_key /opt/starcity/shared/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name uat.starcity.com.ph;
    ssl_certificate /opt/starcity/shared/tls/fullchain.pem;
    ssl_certificate_key /opt/starcity/shared/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name uat-manage.starcity.com.ph;
    ssl_certificate /opt/starcity/shared/tls/fullchain.pem;
    ssl_certificate_key /opt/starcity/shared/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}