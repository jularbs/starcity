version: 1.0
os: linux
files: 
  - source: /
    destination: /home/spc-user/rest-api
hooks: 
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 300
      runas: spc-user
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: spc-user
  ApplicationStart:
    - location: scripts/application-start.sh
      timeout: 300
      runas: spc-user